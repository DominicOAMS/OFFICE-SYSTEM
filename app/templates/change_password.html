{% extends "base.html" %}

{% block title %}Change Password - Office System{% endblock %}

{% block content %}
<div class="container-fluid pt-4 px-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="bg-light rounded p-4">
                <h5 class="mb-3"><i class="fa fa-key text-primary me-2"></i>Change Password</h5>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('main.change_password') }}">
                    <div class="mb-3">
                        <label class="form-label" for="newPassword">New Password</label>
                        <input type="password" class="form-control" id="newPassword" name="new_password" required>
                        <div class="form-text">{{ password_requirements }}</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Password</button>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
