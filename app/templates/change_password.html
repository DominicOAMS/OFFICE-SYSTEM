{% extends "base.html" %}

{% block title %}Change Password - Office System{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl px-4 py-6 sm:px-6">

    <div class="mb-6">
        <h1 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Change Password</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            Update the password used to sign in to your account.
        </p>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">
                <i data-lucide="key-round" class="h-[18px] w-[18px] text-accent-600 dark:text-accent-400"></i>
                Account Security
            </h2>
        </div>

        <div class="px-5 py-5">
            {% if error %}
                <div role="alert"
                     class="mb-5 flex items-start gap-2.5 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3
                            text-sm text-rose-800 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-300">
                    <i data-lucide="circle-alert" class="mt-0.5 h-4 w-4 shrink-0"></i>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('main.change_password') }}" class="space-y-5">
                <div>
                    <label class="label" for="newPassword">New Password</label>
                    <input type="password" class="input" id="newPassword" name="new_password"
                           autocomplete="new-password" required>
                    <p class="help">{{ password_requirements }}</p>
                </div>

                <div>
                    <label class="label" for="confirmPassword">Confirm New Password</label>
                    <input type="password" class="input" id="confirmPassword" name="confirm_password"
                           autocomplete="new-password" required>
                </div>

                <div class="flex items-center gap-2 border-t border-slate-200 pt-5 dark:border-slate-800">
                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="check" class="h-4 w-4"></i>
                        Update Password
                    </button>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
