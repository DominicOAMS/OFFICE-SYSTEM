<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="utf-8">
    <title>Change Password - Office System</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="{{ url_for('static', filename='img/user.png') }}" rel="icon">
    {% include "_head.html" %}
</head>

<body class="h-full bg-slate-100 antialiased dark:bg-slate-950">

    <div class="relative flex min-h-full items-center justify-center px-6 py-12">

        <img src="{{ url_for('static', filename='img/w22.jpg') }}" alt=""
             class="absolute inset-0 h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-br from-brand-900/95 via-brand-800/90 to-slate-900/95"></div>

        <div class="relative w-full max-w-md">

            <div class="mb-6 flex items-center justify-center gap-2.5">
                <span class="grid h-10 w-10 place-items-center rounded-xl bg-white/10 text-white ring-1 ring-white/20 backdrop-blur">
                    <i data-lucide="hospital" class="h-5 w-5"></i>
                </span>
                <div class="leading-tight">
                    <p class="text-sm font-semibold text-white">One Agno Medical Solutions</p>
                    <p class="text-xs text-white/60">Office System</p>
                </div>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl sm:p-8 dark:border-slate-700 dark:bg-slate-900">

                <div class="mb-5 flex items-start gap-3">
                    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-amber-100 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400">
                        <i data-lucide="shield-alert" class="h-5 w-5"></i>
                    </span>
                    <div>
                        <h1 class="text-lg font-semibold text-slate-900 dark:text-white">Change your password</h1>
                        <p class="mt-0.5 text-sm text-slate-500 dark:text-slate-400">
                            You must set a new password before continuing.
                        </p>
                    </div>
                </div>

                {% if error %}
                    <div role="alert"
                         class="mb-4 flex items-start gap-2.5 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3
                                text-sm text-rose-800 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-300">
                        <i data-lucide="circle-alert" class="mt-0.5 h-4 w-4 shrink-0"></i>
                        <span>{{ error }}</span>
                    </div>
                {% endif %}

                <form method="POST" action="{{ url_for('main.change_password') }}" class="space-y-4">
                    <div>
                        <label class="label" for="newPassword">New Password</label>
                        <input type="password" class="input" id="newPassword" name="new_password"
                               autocomplete="new-password" required>
                        <p class="help">{{ password_requirements }}</p>
                    </div>

                    <div>
                        <label class="label" for="confirmPassword">Confirm New Password</label>
                        <input type="password" class="input" id="confirmPassword" name="confirm_password"
                               autocomplete="new-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-full py-2.5">
                        <i data-lucide="check" class="h-4 w-4"></i>
                        Update Password
                    </button>
                </form>

                <div class="mt-5 border-t border-slate-200 pt-4 text-center dark:border-slate-800">
                    <a href="{{ url_for('main.logout') }}"
                       class="inline-flex items-center gap-1.5 text-sm text-slate-500 transition hover:text-accent-600
                              dark:text-slate-400 dark:hover:text-accent-400">
                        <i data-lucide="log-out" class="h-4 w-4"></i>
                        Not you? Log out
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/password_toggle.js') }}"></script>
</body>

</html>
