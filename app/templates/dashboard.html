{% extends "base.html" %}

{% block title %}Dashboard - Office System{% endblock %}

{% block content %}
<div class="container-fluid pt-4 px-4">
    <div class="row g-4">
        <div class="col-sm-6 col-xl-3">
            <div class="bg-light rounded d-flex align-items-center justify-content-between p-4">
                <i class="fa fa-list-alt fa-3x text-primary"></i>
                <div class="ms-3">
                    <p class="mb-2">Purchase Requests</p>
                    <h6 class="mb-0">0</h6>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="bg-light rounded d-flex align-items-center justify-content-between p-4">
                <i class="fa fa-cart-arrow-down fa-3x text-primary"></i>
                <div class="ms-3">
                    <p class="mb-2">Purchase Orders</p>
                    <h6 class="mb-0">0</h6>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="bg-light rounded d-flex align-items-center justify-content-between p-4">
                <i class="fa fa-file-invoice fa-3x text-primary"></i>
                <div class="ms-3">
                    <p class="mb-2">Invoices</p>
                    <h6 class="mb-0">0</h6>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="bg-light rounded d-flex align-items-center justify-content-between p-4">
                <i class="fa fa-warehouse fa-3x text-primary"></i>
                <div class="ms-3">
                    <p class="mb-2">Stocks</p>
                    <h6 class="mb-0">0</h6>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-light text-center rounded p-4 mt-4">
        <h4 class="mb-0">Welcome to the Office System</h4>
        <p class="mb-0">This dashboard is a design placeholder — connect it to your data next.</p>
    </div>
</div>
{% endblock %}
